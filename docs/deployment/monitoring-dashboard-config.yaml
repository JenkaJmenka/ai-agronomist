# Phase 4.1 — Monitoring dashboard configuration
# Last updated: 2026-06-15

api:
  metrics_endpoint: GET /api/monitoring/metrics
  default_lookback_hours: 24
  health_endpoint: GET /health
  notes: >
    Metrics are collected in-process by AnomalyMetrics (singleton).
    Restarting the API clears counters unless exported externally.

metrics:
  total_detections:
    description: Comprehensive pipeline runs in the lookback window
    streamlit_panel: "Pipeline Metrics → Total detections"
  false_positive_rate:
    description: false_positives / total_detections
    target: "< 0.10"
    streamlit_panel: "Pipeline Metrics → False positive rate"
  true_positives:
    description: Operator-confirmed anomalies
    streamlit_panel: "Pipeline Metrics → True positives"
  false_positives:
    description: Operator-marked false positives
    streamlit_panel: "Pipeline Metrics → False positives"
  avg_confidence:
    description: Mean confidence score across detections
    streamlit_panel: "Pipeline Metrics → Avg confidence"
  pattern_distribution:
    description: Count per pattern_type (drift, spike, dependency, etc.)
    streamlit_panel: "Pipeline Metrics → Pattern distribution table"
  confidence_distribution:
    description: Histogram buckets (0.0–1.0 step 0.1)
    streamlit_panel: "Pipeline Metrics → Confidence distribution table"

alerts:
  - id: high_fp_rate
    condition: false_positive_rate > 0.20
    severity: page
    action: Review operator labels; consider CustomerConfigStore rollback
  - id: slow_inference
    condition: comprehensive_inference_p95_ms > 100
    severity: warning
    action: Check model cache warm-up and CPU load
  - id: low_feedback_rate
    condition: true_positives + false_positives == 0 over 7d
    severity: info
    action: Prompt operators via Operator Feedback dashboard
  - id: api_unhealthy
    condition: GET /health != 200
    severity: critical
    action: Restart API container; see docs/deployment/ops-runbook.md

streamlit:
  page: src/dashboard/pages/4_metrics.py
  sections:
    - name: Pipeline Metrics
      source: DashboardApiClient.get_monitoring_metrics(hours=24)
    - name: Sensor Coverage
      source: query_sensor_readings (local DB)
    - name: Export Data
      source: sensor_readings CSV download

future_prometheus:
  enabled: false
  scrape_path: /metrics/prometheus  # not implemented — export AnomalyMetrics to Prometheus
  labels:
    - customer_id
    - pattern_type
