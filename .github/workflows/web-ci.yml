name: web-ci

on:
  # No path filter: a backend-only merge to main must not be able to land
  # without the FE gates running. Task 2 merged to main (dd483d1) without
  # ever triggering this workflow - it touched no web/** files, so the old
  # push filter below never fired, and the last real run stayed at 83e6830
  # until #75 happened to touch web/ and exposed the gap. That is the same
  # class of hole as a test subset silently not covering a changed path.
  push:
    branches: [fe/nextjs-migration, main]
  # pull_request keeps the path filter: a PR that only touches backend code
  # has no FE regression to check, and this is the one place the filter's
  # review-time cost/benefit still favors skipping the run.
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  schedule:
    # 03:17 UTC daily - off-peak, offset from the top of the hour (GitHub's
    # scheduler is congested at :00). No workflow in this repo has an
    # existing cron convention to mirror, so this is a fresh choice.
    - cron: "17 3 * * *"

concurrency:
  # Event name folded into the key, not just github.ref: a scheduled run and
  # a push-to-main run both resolve github.ref to refs/heads/main, so without
  # the event name they'd land in the same group and cancel-in-progress would
  # let one cancel the other. pull_request already has a ref unique to the PR
  # (refs/pull/<n>/merge), so this is a no-op for that case - re-pushing to a
  # PR still cancels its own stale run, which is the behavior we want.
  group: web-ci-${{ github.event_name }}-${{ github.ref }}
  # See backend-tests.yml for the reasoning: never cancel push-to-main runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: lint · typecheck · unit · build · e2e (+perf budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # corepack must be enabled BEFORE setup-node so that the pnpm store
      # cache step (triggered by cache: pnpm) can resolve the pnpm binary.
      - name: Enable corepack
        run: corepack enable
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Caches the pnpm content store (~/.local/share/pnpm/store) keyed on
          # the lockfile. On a hit, pnpm install just hard-links from the store
          # instead of downloading packages (~30 s → a few seconds).
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Resolve Playwright version for browser cache key
        id: pw-version
        # Read the INSTALLED version from the package.json that pnpm wrote into
        # node_modules after the install step above. This is the single source of
        # truth and is immune to peer-dep lines in the lockfile (e.g. Next.js
        # lists @playwright/test as a peer, so grep on the lockfile returns
        # "16.2.10(@playwright/test@1.61.1)..." and a numeric-only grep emits
        # four version numbers, breaking GITHUB_OUTPUT assignment).
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Playwright version '${v}' does not match X.Y.Z — aborting"
            exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        # On a cache hit only the system library dependencies are needed;
        # the browser binaries are already in ~/.cache/ms-playwright.
        # On a cache miss do a full install (browsers + system libs).
        run: |
          if [[ "${{ steps.pw-cache.outputs.cache-hit }}" == "true" ]]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Includes test/e2e/perf.spec.ts — §1.2 budgets fail the build.
      - name: E2E + perf budgets (playwright)
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
