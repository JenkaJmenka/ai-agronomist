name: PostgreSQL Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # Event name in the key so a scheduled run and a push-to-main run on the
  # same ref don't cancel each other (same reasoning as web-ci.yml).
  # Stale PR runs are cancelled; push-to-main runs are never cancelled — see
  # backend-tests.yml for the Railway "Wait for CI" concern.
  group: postgres-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is only needed on pull_request to three-dot diff.
          # On push/schedule the composite action exits before diffing, so a
          # shallow clone of depth 1 is sufficient and faster.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Detect backend changes
        id: detect
        uses: ./.github/actions/backend-changed

  pgvector:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and restore venv cache
        uses: ./.github/actions/python-deps
        # No extra-packages: postgres-tests needs only requirements.txt.
        # The composite action also fixes finding #2: it installs CPU-only
        # torch (--index-url https://download.pytorch.org/whl/cpu) so this
        # job no longer pulls the ~2.5 GB CUDA build.

      - name: Enable pgvector extension
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d test_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          PGPASSWORD: postgres
        run: |
          # Stop short of 023 and seed one row per backfill cohort. An empty
          # database never enters 023's backfill loops, so a migration that
          # only breaks once it has rows to touch upgrades clean here and
          # fails in production instead — which is exactly what happened.
          alembic upgrade 022
          psql -h localhost -U postgres -d test_db -c "
            INSERT INTO sensor_readings
              (tenant_id, greenhouse_id, timestamp, temperature, humidity,
               co2, light, anomaly_score, source, anomaly_type)
            VALUES
              ('t1','gh','2026-01-01T00:00:00Z',21,60,420,500,0.21,'live',NULL),
              ('t1','gh','2026-01-02T00:00:00Z',21,60,420,500,0.90,NULL,'heat_spike'),
              ('t1','gh','2026-01-03T00:00:00Z',21,60,420,500,0.44,NULL,NULL);"
          alembic upgrade head

      - name: Verify migration 023 classified every seeded row
        env:
          PGPASSWORD: postgres
        run: |
          unscaled=$(psql -h localhost -U postgres -d test_db -tAc \
            "SELECT count(*) FROM sensor_readings WHERE score_scale IS NULL;")
          if [ "$unscaled" != "0" ]; then
            echo "023 left $unscaled row(s) unclassified — a backfill loop bailed out early"
            exit 1
          fi

      # Must run before pytest: the pg_db fixture drops and recreates the schema
      # via Base.metadata, which destroys the index the migration just built.
      - name: Assert migration 027 produced the HNSW vector index
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          indexes=$(psql -h localhost -U postgres -d test_db -At \
            -c "SELECT indexname FROM pg_indexes WHERE tablename = 'incidents';")
          echo "$indexes"
          echo "$indexes" | grep -qx 'ix_incidents_embedding_hnsw' \
            || { echo "::error::HNSW index missing after alembic upgrade head"; exit 1; }
          if echo "$indexes" | grep -qx 'ix_incidents_embedding_ivfflat'; then
            echo "::error::migration 027 must drop the ivfflat index it replaces"
            exit 1
          fi

      - name: Run PostgreSQL-only tests
        env:
          # POSTGRES_TEST_URL, not DATABASE_URL: tests/conftest.py overwrites
          # DATABASE_URL with the SQLite test database before any test module is
          # imported, so every test here skipped and this job reported green
          # while exercising nothing.
          POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          # Single invocation (previously two runs, costing ~26 s total):
          # -v for test details, -rs to emit skip-reason lines in the summary
          # (used by the skip-check below), --junitxml for machine-readable
          # skip count as a fallback.
          # Collect by marker across the whole tree, not a hardcoded file list:
          # a new tests/db/test_*_postgres.py is picked up automatically.
          set -o pipefail
          pytest -m postgres -v -rs --junitxml=/tmp/pg-results.xml tests/ \
            2>&1 | tee /tmp/pg-tests.log

      - name: Fail if any PostgreSQL-only test was skipped
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          # A skip here means the suite silently stopped covering Postgres —
          # the failure mode this job was added to prevent.
          # Use per-testcase <skipped> elements, not the suite-level "skipped"
          # attribute: the suite attribute also counts xfail (expected failures),
          # which are not the same as a test that did not run. We count only
          # <skipped> child elements whose "type" attribute is NOT "pytest.xfail".
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET, sys
          try:
              tree = ET.parse("/tmp/pg-results.xml")
              root = tree.getroot()
              # pytest may emit <testsuites><testsuite> or a bare <testsuite>
              suite = root.find("testsuite") if root.tag == "testsuites" else root
              if suite is None:
                  suite = root
              # Count <testcase> elements that contain a <skipped> child
              # whose type is not "pytest.xfail". xfail entries have
              # type="pytest.xfail" and should not trip this check.
              real_skips = 0
              for tc in suite.iter("testcase"):
                  for sk in tc.findall("skipped"):
                      if sk.get("type", "") != "pytest.xfail":
                          real_skips += 1
          except Exception as e:
              print(f"Cannot parse /tmp/pg-results.xml: {e}", file=sys.stderr)
              # Fail-closed: if we cannot parse the XML, assume something was
              # skipped so the problem does not go undetected.
              print("Treating unparseable XML as a skip — failing the check")
              sys.exit(1)
          if real_skips:
              print(
                  f"PostgreSQL-only tests were skipped ({real_skips}) — "
                  "they are not actually running"
              )
              sys.exit(1)
          print(f"Skip check passed (0 real skips; xfail entries not counted)")
          EOF
