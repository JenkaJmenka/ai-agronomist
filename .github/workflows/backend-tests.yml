name: backend-tests

# The Python suite had no CI workflow at all: web-ci covers only web/, and
# postgres-tests runs migrations plus the postgres-marked tests. Nothing ran
# the ~2860 backend tests on a push or a pull request, which is how the
# 2026-09-11 upload incident reached production green.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: backend-tests-${{ github.ref }}
  # cancel-in-progress is true only for pull_request events.
  # Railway's "Wait for CI" treats a cancelled run as non-blocking when
  # another run on the same commit passed — so cancelling a push-to-main
  # run could let an untested commit deploy. Never cancel main-push runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is only needed on pull_request to three-dot diff.
          # On push/schedule the composite action exits before diffing, so a
          # shallow clone of depth 1 is sufficient and faster.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Detect backend changes
        id: detect
        uses: ./.github/actions/backend-changed

  pytest:
    name: pytest (unit + integration)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and restore venv cache
        uses: ./.github/actions/python-deps
        with:
          # pytest-xdist is not in requirements.txt — install it here so the
          # shared venv cache key (requirements*.txt hash) stays stable.
          extra-packages: pytest-xdist

      - name: Run test suite
        env:
          # conftest.py pins DATABASE_URL to a local SQLite file; set here too
          # so a runner with a stray value cannot redirect the suite.
          DATABASE_URL: sqlite+aiosqlite:///./test_global.db
        run: |
          # python -m pytest, not bare pytest: it puts the repo root on
          # sys.path so `import src...` resolves.
          # --ignore=tests/load: locust scenarios are driven by the locust CLI.
          # -p no:randomly keeps ordering deterministic.
          # -n auto --dist loadfile: xdist parallel workers; loadfile keeps
          # tests from the same module on the same worker (SQLite file-locking
          # compatible — conftest.py gives each worker its own SQLite file).
          # --junitxml: provides total-count data for the floor check below,
          # replacing the old second --collect-only pass (~8 s saved per run).
          python -m pytest tests/ \
            --ignore=tests/load \
            -q \
            --timeout=300 \
            -p no:randomly \
            -n auto \
            --dist loadfile \
            --junitxml=junit.xml

      - name: Fail if the suite collected far fewer tests than expected
        run: |
          # Assert a floor on collection so a silent import/collection failure
          # cannot pass for a green suite — the same class of false green this
          # workflow exists to end. Parse from the junitxml produced above
          # (replaces the second --collect-only pass that cost ~8 s per run).
          # Bump the floor as the suite grows.
          count=$(python3 - << 'EOF'
          import xml.etree.ElementTree as ET, sys
          try:
              tree = ET.parse("junit.xml")
              root = tree.getroot()
              # pytest may emit <testsuites><testsuite> or a bare <testsuite>
              suite = root.find("testsuite") if root.tag == "testsuites" else root
              if suite is None:
                  suite = root
              print(suite.get("tests", "0"))
          except Exception as e:
              print(f"0", file=sys.stderr)
              print(f"Cannot parse junit.xml: {e}", file=sys.stderr)
              print("0")
          EOF
          )
          echo "Total tests from junitxml: ${count:-0}"
          if [ "${count:-0}" -lt 2500 ]; then
            echo "Expected at least 2500 tests, got ${count:-0}"
            echo "This may indicate a silent import or collection failure."
            exit 1
          fi
