name: openapi-drift

# web/openapi.json and web/lib/api-types.gen.ts are committed snapshots of
# the FastAPI schema, not hand-maintained files. Either one can go stale
# the moment a route or Pydantic model changes anywhere under src/ without
# anyone re-running the generators — this job rebuilds both from scratch
# and fails the build if the result doesn't match what's checked in.
#
# No path filter at the workflow level: a schema-affecting change can
# originate from any model or route module under src/, not just src/api/,
# so this runs on every push and pull request. Path-based skipping is handled
# by the changes job below, which is conservative (unknown → run) and does
# NOT skip when web/openapi.json or web/lib/api-types.gen.ts are in the diff.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: openapi-drift-${{ github.ref }}
  # See backend-tests.yml for the reasoning: never cancel push-to-main runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is only needed on pull_request to three-dot diff.
          # On push/schedule the composite action exits before diffing, so a
          # shallow clone of depth 1 is sufficient and faster.
          # String literals required: 0 is falsy in GitHub Actions expressions,
          # so `cond && 0 || 1` evaluates to 1 for every event.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Detect backend changes
        id: detect
        uses: ./.github/actions/backend-changed

  check:
    name: openapi.json / api-types.gen.ts drift check
    needs: changes
    # Run unless the changes job explicitly output 'false'.
    # If changes failed (output is empty) we treat it as backend=true so the
    # gate fails closed rather than open: a skipped job satisfies required
    # status checks, allowing a broken commit through.
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and restore venv cache
        uses: ./.github/actions/python-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm version is pinned by web/package.json "packageManager".
      - name: Enable corepack
        run: corepack enable

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate openapi.json from the live app definition
        env:
          # src/db/session.py defaults DATABASE_URL to a local sqlite file,
          # but set it explicitly so a runner with a stray value in its
          # environment can't change what schema gets built.
          DATABASE_URL: sqlite+aiosqlite:///./test_global.db
        run: python scripts/dump_openapi.py

      - name: Regenerate api-types.gen.ts from openapi.json
        working-directory: web
        run: pnpm gen:api

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- web/openapi.json web/lib/api-types.gen.ts; then
            echo ""
            echo "web/openapi.json and/or web/lib/api-types.gen.ts are out of date"
            echo "with the FastAPI schema. Regenerate them and commit the result:"
            echo ""
            echo "  pnpm --dir web gen:api:refresh"
            echo ""
            echo "(that assumes a provisioned venv/ at the repo root; if pnpm"
            echo "isn't available, run the two steps it wraps directly:"
            echo "  ./venv/bin/python scripts/dump_openapi.py && pnpm --dir web gen:api)"
            echo ""
            exit 1
          fi
