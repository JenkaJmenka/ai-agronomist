services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: anomaly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anomaly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["/app/docker/start-api.sh"]
    ports:
      - "8000:8000"
    environment:
      # ENVIRONMENT now defaults to "production" (fail-closed: a deployment
      # that forgets to set it refuses to start rather than silently running
      # with auth disabled) — local docker-compose must opt out explicitly.
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/anomaly_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/docker/start-worker.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/anomaly_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      # CPU thread pools for torch + numpy/sklearn; match to the cpus limit
      # below. Production values live in docs/deployment/railway.md.
      TORCH_NUM_THREADS: "4"
      # One portion per worker at a time so each portion uses the full thread
      # pool; scale find-phase throughput with replicas, not prefetch.
      MQ_PREFETCH_COUNT: "1"
      # Toggle PROFILE phase-timing logs on demand (restart applies the change).
      PROFILE_LOGGING_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

  dashboard:
    build: .
    command: ["/app/docker/start-dashboard.sh"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      LOG_LEVEL: INFO
    depends_on:
      - api

volumes:
  postgres_data:
