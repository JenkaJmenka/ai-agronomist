services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: anomaly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anomaly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["/app/docker/start-api.sh"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/anomaly_db
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    command: ["/app/docker/start-dashboard.sh"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      LOG_LEVEL: INFO
    depends_on:
      - api

volumes:
  postgres_data:
