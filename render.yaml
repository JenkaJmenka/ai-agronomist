# Render blueprint — full app (API + Streamlit + Postgres)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-agronomist-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/docker/start-api.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-agronomist-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: ai-agronomist-dashboard
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/docker/start-dashboard.sh
    envVars:
      - key: API_URL
        fromService:
          name: ai-agronomist-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: ai-agronomist-db
    plan: free
    databaseName: anomaly_db
    user: agronomist
